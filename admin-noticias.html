<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisar noticias — CSH Talent</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --petrol: #2F4E5F; --petrol-soft: #4A90A4; --petrol-pale: #e6ecef;
  --coral: #E87B6F; --coral-deep: #d26359; --coral-pale: #fdece9;
  --dark: #111827; --text: #1f2937; --muted: #6b7280; --muted2: #9ca3af;
  --border: #e5e7eb; --surface: #f9fafb; --white: #ffffff;
}
body { font-family: 'Raleway', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }
.wrap { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem; }
h1 { font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 0.4rem; }
.sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 2rem; }
.estado-msg { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }
.card { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
.meta { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted2); }
.titular { font-size: 1rem; font-weight: 700; color: var(--dark); line-height: 1.5; }
.url { font-size: 0.78rem; color: var(--petrol-soft); word-break: break-all; text-decoration: none; }
.acciones { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
button { font-family: 'Raleway', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.55rem 1.1rem; border-radius: 8px; border: none; cursor: pointer; transition: opacity 0.15s; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-aprobar { background: var(--petrol); color: white; }
.btn-descartar { background: var(--white); color: var(--coral-deep); border: 1.5px solid var(--coral-pale); }
.card.procesando { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Noticias por revisar</h1>
  <p class="sub">Actualidad laboral — aprueba las que quieras publicar en el home, o descarta las que no aplican.</p>
  <div id="contenido">
    <div class="estado-msg">Cargando…</div>
  </div>
</div>

<script src="csh-auth.js"></script>
<script src="assistant.js"></script>
<script>
function esperarSupabaseClient(intentosRestantes = 30) {
  return new Promise((resolve, reject) => {
    (function check(intentos) {
      if (typeof window.getCSHSupabaseClient === 'function') {
        resolve(window.getCSHSupabaseClient());
      } else if (intentos <= 0) {
        reject(new Error('No se pudo inicializar la sesión'));
      } else {
        setTimeout(() => check(intentos - 1), 150);
      }
    })(intentosRestantes);
  });
}

async function iniciar() {
  let sb;
  try {
    sb = await esperarSupabaseClient();
  } catch (e) {
    document.getElementById('contenido').innerHTML = '<div class="estado-msg">No se pudo cargar la sesión. Intenta recargar la página.</div>';
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('contenido').innerHTML = '<div class="estado-msg">Inicia sesión con tu cuenta de administradora para ver esta página.</div>';
    return;
  }
  await cargarPendientes(session.access_token);
}

async function cargarPendientes(token) {
  const contenido = document.getElementById('contenido');
  try {
    const res = await fetch('/api/moderar-noticias', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (!data.ok) {
      contenido.innerHTML = `<div class="estado-msg">${data.error || 'No tienes acceso a esta página.'}</div>`;
      return;
    }
    if (data.pendientes.length === 0) {
      contenido.innerHTML = '<div class="estado-msg">No hay noticias pendientes por ahora.</div>';
      return;
    }
    contenido.innerHTML = data.pendientes.map(n => `
      <div class="card" id="card-${n.id}">
        <div class="meta">${n.medio} · ${n.fecha}</div>
        <div class="titular">${n.titular}</div>
        <a href="${n.url}" target="_blank" rel="noopener" class="url">${n.url}</a>
        <div class="acciones">
          <button class="btn-aprobar" onclick="moderar('${n.id}','aprobar', '${token}')">Aprobar</button>
          <button class="btn-descartar" onclick="moderar('${n.id}','descartar', '${token}')">Descartar</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    contenido.innerHTML = '<div class="estado-msg">Error al cargar las noticias pendientes.</div>';
  }
}

async function moderar(id, accion, token) {
  const card = document.getElementById(`card-${id}`);
  card.classList.add('procesando');
  try {
    const res = await fetch('/api/moderar-noticias', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ id, accion })
    });
    const data = await res.json();
    if (data.ok) {
      card.remove();
    } else {
      card.classList.remove('procesando');
      alert(data.error || 'Error al procesar.');
    }
  } catch (e) {
    card.classList.remove('procesando');
    alert('Error al procesar.');
  }
}

iniciar();
</script>
</body>
</html>
